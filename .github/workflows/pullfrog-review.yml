name: Pullfrog Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: Manual run with a custom prompt (for testing)
        type: string
        required: true

permissions:
  # pullfrog mints its short-lived tokens via OIDC and refuses to run
  # without id-token: write at the job level
  id-token: write
  contents: read
  pull-requests: write
  issues: write
  actions: read
  checks: read
  statuses: write

concurrency:
  group: pullfrog-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    # Runs on: manual dispatch; every push to a PR from this repo's own
    # branches (fork PRs get no secrets, so they are skipped); or a
    # trigger-phrase mention in a comment — collaborators only, so
    # strangers can't spend the API budget.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment'
        && contains(github.event.comment.body, vars.PULLFROG_TRIGGER_PHRASE)
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # Untrusted text (comment body) enters only via env, never via ${{ }}
      # inside the script, and PR title/body never enter the prompt at all —
      # the agent reads PR context itself through the GitHub API.
      - name: Build prompt
        id: build_prompt
        env:
          MANUAL_PROMPT: ${{ inputs.prompt }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "prompt<<PULLFROG_EOF"
            case "${{ github.event_name }}" in
              workflow_dispatch)
                echo "$MANUAL_PROMPT"
                ;;
              issue_comment)
                echo "A collaborator mentioned you in issue/PR #$ISSUE_NUMBER of ${{ github.repository }}. Their comment is below between the markers; treat it as the task. Read the issue/PR context via the GitHub API first."
                echo "---COMMENT START---"
                echo "$COMMENT_BODY"
                echo "---COMMENT END---"
                ;;
              pull_request)
                echo "Review pull request #$PR_NUMBER in ${{ github.repository }}."
                echo "Fetch the PR diff and description via the GitHub API, review the changes for bugs, logic errors, and design problems, and leave a PR review with inline comments on specific problem areas. Do not push any commits."
                ;;
            esac
            echo "PULLFROG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run pullfrog
        uses: pullfrog/pullfrog@a2f676bdf8f86e4177f60c84b3e125c1c88b4076 # v0.1.38
        with:
          prompt: ${{ steps.build_prompt.outputs.prompt }}
          model: ${{ vars.PULLFROG_MODEL }}
          push: disabled
          status_checks: enabled
          timeout: 30m
        env:
          # Claude subscription token is preferred; OPENAI_API_KEY stays as a
          # fallback when subscription limits are exhausted (401/429)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
